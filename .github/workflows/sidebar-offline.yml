name: Sidebar offline regressions

on:
  pull_request:
    paths:
      - '.agents/skills/chatgpt-pro-sidebar/**'
      - '.github/workflows/sidebar-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidebar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Node DOM and composer regressions
        shell: pwsh
        run: |
          $files = Get-ChildItem '.agents/skills/chatgpt-pro-sidebar/tests' -Filter '*.test.mjs' | ForEach-Object FullName
          & node --test @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell offline regressions
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path '.agents/skills/chatgpt-pro-sidebar/tests' -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { exit 1 }
