version: 2
# The CCG component snapshot is frozen and validated against harness.sources.json.
# Its npm/Go dependencies still need normal and security updates: apply them in
# the authoritative CCG source first, then bring them in by controlled import.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
