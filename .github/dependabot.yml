version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/components/ccg-workflow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/components/ccg-workflow/codeagent-wrapper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
