name: Build codeagent-wrapper binaries

on:
  push:
    paths:
      - '.github/workflows/build-binaries.yml'
      - 'codeagent-wrapper/**'
      - 'src/utils/installer.ts'
      - 'scripts/wrapper-release.json'
      - 'scripts/verify-wrapper-release.mjs'
  workflow_dispatch:
    inputs:
      publish_assets:
        description: 'Publish the reviewed versioned assets from main'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Verify exact source and release recipe
        run: node scripts/verify-wrapper-release.mjs

      - name: Cross-compile binaries twice
        working-directory: codeagent-wrapper
        run: |
          set -e
          mkdir -p ../artifacts ../artifacts-repeat

          declare -a targets=(
            "darwin:amd64:"
            "darwin:arm64:"
            "linux:amd64:"
            "linux:arm64:"
            "windows:amd64:.exe"
            "windows:arm64:.exe"
          )

          for directory in artifacts artifacts-repeat; do
            for target in "${targets[@]}"; do
              IFS=':' read -r os arch ext <<< "$target"
              output="codeagent-wrapper-${os}-${arch}${ext}"
              echo "::group::Building ${directory}/${output}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -buildvcs=false -trimpath -ldflags="-s -w" -o "../${directory}/${output}" .
              echo "::endgroup::"
            done
          done

          echo "### Build artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh ../artifacts/ | awk 'NR>1{printf "- `%s` (%s)\n", $NF, $5}' >> $GITHUB_STEP_SUMMARY

      - name: Verify both builds against the six installer pins
        run: node scripts/verify-wrapper-release.mjs artifacts artifacts-repeat

      - name: Stage verified assets for an explicitly approved main release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_assets == true
        uses: actions/upload-artifact@v4
        with:
          name: verified-wrapper-assets
          path: artifacts/codeagent-wrapper-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_assets == true
    runs-on: ubuntu-latest
    concurrency:
      group: wrapper-release-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - uses: actions/download-artifact@v4
        with:
          name: verified-wrapper-assets
          path: artifacts

      - name: Recheck downloaded assets and release identity
        run: node scripts/verify-wrapper-release.mjs artifacts

      - name: Read versioned release target
        id: release
        run: |
          tag="$(node -p "JSON.parse(require('node:fs').readFileSync('scripts/wrapper-release.json')).releaseTag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Reject a previously used release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "Git tag already exists: $RELEASE_TAG" >&2
            exit 1
          elif [[ "$tag_status" -ne 2 ]]; then
            echo "Could not verify release tag availability (git exit $tag_status)" >&2
            exit 1
          fi

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/codeagent-wrapper-* \
            --target "$GITHUB_SHA" \
            --title "Verified codeagent-wrapper $RELEASE_TAG" \
            --notes "Reviewed source and six SHA-256-pinned assets." \
            --prerelease --latest=false
