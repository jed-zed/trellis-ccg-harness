name: Repair codeagent-wrapper R2 mirror

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing wrapper release tag'
        type: string
        required: true
      expected_commit:
        description: 'Approved full 40-character commit SHA for this tag'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: wrapper-r2-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: wrapper-r2-mirror-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved tag and commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^wrapper-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected commit must be a full lowercase SHA' >&2; exit 1; }
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_COMMIT" ]] || { echo 'Tag does not resolve to approved commit' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main || { echo 'Approved commit is not in main history' >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --global wrangler@4.148.0

      - name: Verify and repair R2 mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node scripts/repair-wrapper-r2.mjs "$RELEASE_TAG" "$EXPECTED_COMMIT"
